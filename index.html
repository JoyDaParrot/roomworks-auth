<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>RoomWorks Sign-in</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: #15171c; color: #e8e8ea; font: 18px/1.5 system-ui, sans-serif; text-align: center; }
  a { color: #8ab4ff; font-size: 20px; }
</style>
</head>
<body>
<main>
  <p id="msg">Returning to RoomWorks…</p>
  <p><a id="back" href="roomworks://auth-callback/" hidden>Tap here if the game did not open</a></p>
</main>
<script>
  // Google will not redirect to roomworks:// itself, so it lands here and we pass the one-time
  // code straight on. Nothing is stored or sent anywhere else. The code is useless without the
  // client secret, which only the game's server (UGS Cloud Code) holds.
  (function () {
    var q = new URLSearchParams(location.search);
    var state = q.get("state") || "";
    var out = new URLSearchParams();
    ["code", "state", "error"].forEach(function (k) { if (q.get(k)) out.set(k, q.get(k)); });

    // PC builds listen on a local port; the headset uses the app link.
    var base = state.indexOf("pc.") === 0
      ? "http://127.0.0.1:47821/auth-callback/"
      : "roomworks://auth-callback/";
    var target = base + "?" + out.toString();

    if (q.get("error")) document.getElementById("msg").textContent = "Sign-in was cancelled.";
    var link = document.getElementById("back");
    link.href = target;
    link.hidden = false;
    history.replaceState(null, "", location.pathname); // keep the code out of browser history
    location.replace(target);
  })();
</script>
</body>
</html>
